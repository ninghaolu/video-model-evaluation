[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-model-evaluation"
version = "0.1.0"
description = "Hydra-driven metrics for evaluating videos generated by video models."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Anonymous Authors" },
]
dependencies = [
  "decord>=0.6.0",
  "hydra-core>=1.3.2",
  "imageio[ffmpeg]>=2.34.0",
  "lpips>=0.1.4",
  "numpy>=1.24.0",
  "omegaconf>=2.3.0",
  "scikit-image>=0.22.0",
  "scipy>=1.10.0",
  "torch>=2.5.0",
  "torchvision>=0.20.0",
  "tqdm>=4.67.0",
]

[project.scripts]
video-model-eval = "video_model_evaluation.cli:main"
video-model-eval-step = "video_model_evaluation.step_eval:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video_model_evaluation = ["configs/*.yaml"]
